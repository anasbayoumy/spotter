name: spotter-v1

x-postgres-environment: &postgres-environment
  POSTGRES_DB: spotter
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:-spotter_admin_local_only}
  SPOTTER_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:-spotter_local_only}

x-app-environment: &app-environment
  APP_ENV: ${APP_ENV:-development}
  AI_MODE: ${AI_MODE:-recorded}
  ALLOW_NO_AUTH_SYNTHETIC_DEMO: ${ALLOW_NO_AUTH_SYNTHETIC_DEMO:-true}
  CRON_SECRET: ${CRON_SECRET:-local-demo-cron-only}
  DATA_POLICY: ${DATA_POLICY:-synthetic_only}
  DATABASE_MODE: postgres
  DATABASE_URL: ${DATABASE_URL:-postgresql://spotter_app:${POSTGRES_APP_PASSWORD:-spotter_local_only}@postgres:5432/spotter}
  DEMO_CLIENT_ID: ${DEMO_CLIENT_ID:-00000000-0000-0000-0000-000000000101}
  DEMO_COACH_ID: ${DEMO_COACH_ID:-00000000-0000-0000-0000-000000000001}
  LOG_LEVEL: ${LOG_LEVEL:-info}

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment: *postgres-environment
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - spotter-postgres:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d spotter"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  test-postgres:
    image: pgvector/pgvector:pg16
    profiles: ["test"]
    environment: *postgres-environment
    ports:
      - "127.0.0.1:${POSTGRES_TEST_PORT:-5433}:5432"
    tmpfs:
      - /var/lib/postgresql/data
    volumes:
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d spotter"]
      interval: 1s
      timeout: 3s
      retries: 40
      start_period: 3s
    restart: "no"
    security_opt:
      - no-new-privileges:true

  migrate:
    build:
      context: .
      dockerfile: docker/Dockerfile.migrate
    environment: *app-environment
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    security_opt:
      - no-new-privileges:true

  seed:
    profiles: ["demo"]
    build:
      context: .
      dockerfile: docker/Dockerfile.seed
    environment: *app-environment
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"
    security_opt:
      - no-new-privileges:true

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
    environment:
      <<: *app-environment
      HOSTNAME: 0.0.0.0
      PORT: 3000
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'node -e
          "fetch(''http://127.0.0.1:3000/health/ready'').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"',
        ]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s
    init: true
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true

volumes:
  spotter-postgres:
